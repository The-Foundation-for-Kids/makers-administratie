name: Run PHPUnit Tests

on:
  push:
    branches:
      - wordpress-integratie
      - main
  pull_request:
    branches:
      - wordpress-integratie
      - main

jobs:
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    # Deze env-variabelen winnen van de <env> waarden in phpunit.xml.dist
    # (PHPUnit overschrijft bestaande variabelen niet zonder force="true").
    env:
      APP_ENV: testing
      COMPOSER_ALLOW_SUPERUSER: 1
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: makersadmini_test
      DB_USERNAME: runner
      DB_PASSWORD: secret

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: makersadmini_test
          MYSQL_USER: runner
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction

      - name: Generate app key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Wait for MySQL and create test database
        run: |
          printf '[client]\nuser=root\npassword=secret\nhost=127.0.0.1\nport=3306\nprotocol=tcp\n' > "$RUNNER_TEMP/my.cnf"
          chmod 600 "$RUNNER_TEMP/my.cnf"
          for i in $(seq 1 30); do
            mysql --defaults-extra-file="$RUNNER_TEMP/my.cnf" -e "SELECT 1" && break
            sleep 2
          done
          # MySQL 8: IDENTIFIED BY is niet toegestaan in GRANT; user apart aanmaken/wijzigen.
          mysql --defaults-extra-file="$RUNNER_TEMP/my.cnf" -e "CREATE DATABASE IF NOT EXISTS makersadmini_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'runner'@'%' IDENTIFIED BY 'secret'; ALTER USER 'runner'@'%' IDENTIFIED BY 'secret'; GRANT ALL PRIVILEGES ON makersadmini_test.* TO 'runner'@'%'; FLUSH PRIVILEGES;"

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: composer run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: storage/logs/laravel.log
