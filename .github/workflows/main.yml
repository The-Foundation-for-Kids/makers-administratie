name: scp files
on:
  push:
    branches:
      - main # alleen browsertests, geen deploy
      - prod
      - test
      - sendy
jobs:
  # Browsertests tegen een eigen kopie van de site met een lege testdatabase.
  # Slagen ze niet, dan wordt er niet gedeployd. Zie tests/browser/README.md.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: makers_browsertest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_mysql, zip, gd, intl, bcmath
      - name: Install Composer Dependencies
        run: composer install --no-dev --no-progress --no-interaction --prefer-dist
      - name: Prepare app for tests
        run: |
          cat > .env <<'EOF'
          APP_NAME="Browsertest"
          APP_ENV=ci
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8123
          LOG_CHANNEL=single
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=makers_browsertest
          DB_USERNAME=root
          DB_PASSWORD=root
          SESSION_DRIVER=database
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=log
          EOF
          php artisan key:generate --force
          php artisan migrate:fresh --force --seed --seeder=BrowserTestSeeder
      - name: Start app
        run: |
          # --no-reload is nodig om echt 4 workers te krijgen.
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --no-reload --host=127.0.0.1 --port=8123 > storage/logs/server.log 2>&1 &
          # Het eerste verzoek is traag (nog niets gecachet); daarom ruim wachten.
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 http://127.0.0.1:8123/login || true)
            [ "$status" = "200" ] && exit 0
            sleep 2
          done
          echo "App start niet (laatste status: $status)"
          echo "--- server.log"; cat storage/logs/server.log
          echo "--- laravel.log"; tail -n 60 storage/logs/laravel.log || true
          exit 1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test --project=ci
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browsertests-rapport
          path: |
            playwright-report/
            test-results/
            storage/logs/
          retention-days: 14

  build:
    needs: browser-tests
    # Op main alleen testen; deployen gebeurt via test, prod en sendy.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set env BRANCH
        run: echo "BRANCH=$(echo $GITHUB_REF | cut -d'/' -f 3)" >> $GITHUB_ENV

      - name: Set env NEED
        run: |
          if [[ $BRANCH == 'prod' && $GITHUB_EVENT_NAME == 'push' ]]; then
              echo "LOCATION=prod" >> "$GITHUB_ENV"
              echo "DIRECTORY=kledingmaken.thefoundationforkids.com" >> "$GITHUB_ENV"
          elif  [[ $BRANCH == 'test' && $GITHUB_EVENT_NAME == 'push' ]]; then
              echo "LOCATION=test" >> "$GITHUB_ENV"
              echo "DIRECTORY=kledingmakentest.thefoundationforkids.com" >> "$GITHUB_ENV"
          elif  [[ $BRANCH == 'sendy' && $GITHUB_EVENT_NAME == 'push' ]]; then
              echo "LOCATION=sendy" >> "$GITHUB_ENV"
              echo "DIRECTORY=kledingmakensendy.thefoundationforkids.com" >> "$GITHUB_ENV"
          else
              echo "LOCATION=test" >> "$GITHUB_ENV"
              echo "DIRECTORY=kledingmakentest.thefoundationforkids.com" >> "$GITHUB_ENV"
          fi
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - name: Install Composer Dependencies
        run: composer install --optimize-autoloader --no-dev --no-progress --no-interaction --prefer-dist
      - name: Tar directory
        run:  tar -czf kledingmaken.tar.gz ./*
      - name: Ping remote
        run:  ssh -o ConnectTimeout=5 -p 2222 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "exit" || true
      - name: Ping remote 2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          script: |
            echo ping
            exit
      - name: Deploy to web server
        uses: moonpathbg/scp_uploader@latest
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 2222
          username: ${{ secrets.SSH_USER }}
          key : ${{ secrets.SSH_KEY }}
          source: kledingmaken.tar.gz
          target: /home2/qdzadgmy/kledingmakenstaging.thefoundationforkids.com/${{ env.LOCATION }}.tar.gz

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          script: |
            export PATH=/opt/cpanel/ea-php84/root/usr/bin:$PATH
            cd /home2/qdzadgmy/kledingmakenstaging.thefoundationforkids.com/

            rm -r -f /home2/qdzadgmy/kledingmakenstaging.thefoundationforkids.com/${{ env.LOCATION }}
            mkdir ${{ env.LOCATION }}
            tar -xzf ${{ env.LOCATION }}.tar.gz -C /home2/qdzadgmy/kledingmakenstaging.thefoundationforkids.com/${{ env.LOCATION }}

            cp /home2/qdzadgmy/kledingmakenstaging.thefoundationforkids.com/${{ env.LOCATION }}.env /home2/qdzadgmy/kledingmakenstaging.thefoundationforkids.com/${{ env.LOCATION }}/.env
            rsync -a --delete /home2/qdzadgmy/kledingmakenstaging.thefoundationforkids.com/${{ env.LOCATION }}/ /home2/qdzadgmy/${{ env.DIRECTORY }}/
            cd /home2/qdzadgmy/${{ env.DIRECTORY }}/
            php artisan migrate
            php artisan db:seed --class=ShieldSeeder
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan filament:optimize
            exit

  # Na een deploy naar test: alleen-lezen-controles tegen de test-site zelf.
  # Draait alleen als de testaccounts als secrets zijn ingesteld.
  test-site-check:
    needs: build
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ vars.TEST_SITE_URL || 'https://kledingmakentest.thefoundationforkids.com' }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_MAAKSTER1_EMAIL: ${{ secrets.TEST_MAAKSTER1_EMAIL }}
      TEST_MAAKSTER1_PASSWORD: ${{ secrets.TEST_MAAKSTER1_PASSWORD }}
      TEST_INZAMELPUNT_EMAIL: ${{ secrets.TEST_INZAMELPUNT_EMAIL }}
      TEST_INZAMELPUNT_PASSWORD: ${{ secrets.TEST_INZAMELPUNT_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run read-only checks against test site
        run: npx playwright test --project=test-site
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-site-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 14


